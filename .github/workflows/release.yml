name: release
permissions:
  checks: write
  pull-requests: write
  packages: write
  deployments: write
  contents: write
  id-token: write # Required for OIDC authentication

on:
  push:
    tags:
      - 'v\d.*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "22.x"
          registry-url: https://registry.npmjs.org/
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
      - run: npm install --global npm@11.21.2
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build
      - name: Package SDKs
        run: |
          npm pack --workspace azure-kusto-data --pack-destination packages/azure-kusto-data
          npm pack --workspace azure-kusto-ingest --pack-destination packages/azure-kusto-ingest
      - name: Github Release
        uses: docker://antonyurchenko/git-release:latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: packages/azure-kusto-data/*.tgz packages/azure-kusto-ingest/*.tgz
      - name: Publish new versions
        run: |
          npx --no-install lerna publish from-git --yes
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}

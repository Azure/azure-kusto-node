name: Node.js Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run checkFormat
        continue-on-error: true

      - run: npm run lint

      - name: Run unit tests without authenticated E2E
        run: npm run testNoE2E -- --ci --maxWorkers=2
        env:
          AUTO_TEST: "true"

name: Node.js Build

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  checks: write
  pull-requests: write
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: build
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
      - run: npm ci
      - run: npm run checkFormat
        continue-on-error: true
      - run: npm run lint
      - name: Azure login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.APP_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}
      - run: npm run testPipeline
        env:
          AUTO_TEST: true
          LOGIN_TEST: true
          TEST_DATABASE: ${{ secrets.TEST_DATABASE }}
          ENGINE_CONNECTION_STRING: ${{ secrets.ENGINE_CONNECTION_STRING }}
          DM_CONNECTION_STRING: ${{ secrets.DM_CONNECTION_STRING }}
          AZURE_CLIENT_ID: ${{ secrets.APP_ID }}
          AZURE_TENANT_ID: ${{ secrets.TENANT_ID }}
          # Required for running tests when using ESM, see https://kulshekhar.github.io/ts-jest/docs/guides/esm-support
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@f32b3a3741e1053eb607407145bc9619351dc93b # v2.1.0
      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@b9f6c61d965bcaa18acc02d6daf706373a448f02 # v1.40
        if: always()
        with:
          files: |
            junit.xml

name: Node.js Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.12.0", "22.x", "24.x", "26.x"]
    env:
      LOGIN_TEST: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install --global npm@11.21.2
      - run: npm ci
      - run: npm run lint
      - run: npm run testNoE2E -- --ci --runInBand
      - run: npm run testQuickStart
      - run: npm run webpackBuild

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm install --global npm@11.21.2
      - run: npm ci

      - run: npm run checkFormat
        continue-on-error: true

      - run: npm run lint

      - name: Run unit tests without authenticated E2E
        run: npm run testNoE2E -- --ci --maxWorkers=2 --coverage
        env:
          AUTO_TEST: "true"
          LOGIN_TEST: ""

      - name: Upload unit coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1

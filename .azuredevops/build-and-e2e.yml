trigger:
    branches:
        include:
            - master
    tags:
        exclude:
            - "*"

pr:
    branches:
        include:
            - master

pool:
    vmImage: ubuntu-latest

jobs:
    - job: E2E
      displayName: Run authenticated Kusto E2E tests
      timeoutInMinutes: 40
      condition: and(succeeded(), ne(variables['System.PullRequest.IsFork'], 'True'))
      variables:
          - group: azure-kusto-node-e2e
          - name: npm_config_cache
            value: $(Pipeline.Workspace)/.npm
      steps:
          - checkout: self
            clean: true
            persistCredentials: false

          - task: NodeTool@0
            displayName: Use Node.js 20
            inputs:
                versionSpec: "20.x"

          - task: Cache@2
            displayName: Cache npm downloads
            inputs:
                key: 'npm | "$(Agent.OS)" | package-lock.json'
                restoreKeys: |
                    npm | "$(Agent.OS)"
                path: $(npm_config_cache)

          - script: npm ci
            displayName: Install dependencies and build

          - task: UseDotNet@2
            displayName: Set up E2E coverage publisher runtime
            inputs:
                packageType: sdk
                version: "8.x"

          - task: AzureCLI@2
            displayName: Run authenticated Kusto E2E tests
            inputs:
                azureSubscription: kusto-connectors-arm-sc
                scriptType: bash
                scriptLocation: inlineScript
                workingDirectory: $(Build.SourcesDirectory)
                inlineScript: |
                    set -euo pipefail

                    for name in ENGINE_CONNECTION_STRING DM_CONNECTION_STRING TEST_DATABASE; do
                        value="${!name:-}"
                        if [[ -z "$value" || "$value" == '$('* ]]; then
                            echo "##vso[task.logissue type=error]Required pipeline variable ${name} is missing or unresolved." >&2
                            exit 1
                        fi
                    done

                    npm run testPipeline -- \
                        --testPathPattern '/.*e2e.*/' \
                        --coverageReporters=text \
                        --coverageReporters=cobertura
            env:
                AUTO_TEST: "true"
                LOGIN_TEST: "true"
                ENGINE_CONNECTION_STRING: $(ENGINE_CONNECTION_STRING)
                DM_CONNECTION_STRING: $(DM_CONNECTION_STRING)
                TEST_DATABASE: $(TEST_DATABASE)
                JEST_JUNIT_OUTPUT_DIR: $(Agent.TempDirectory)/test-results

          - task: PublishTestResults@2
            displayName: Publish E2E test results
            condition: always()
            inputs:
                testResultsFormat: JUnit
                testResultsFiles: junit.xml
                searchFolder: $(Agent.TempDirectory)/test-results
                testRunTitle: azure-kusto-node E2E
                failTaskOnFailedTests: true
                failTaskOnMissingResultsFile: true

          - task: PublishCodeCoverageResults@2
            displayName: Publish E2E code coverage
            condition: succeededOrFailed()
            inputs:
                summaryFileLocation: $(Build.SourcesDirectory)/coverage/cobertura-coverage.xml
                pathToSources: $(Build.SourcesDirectory)
                failIfCoverageEmpty: true
